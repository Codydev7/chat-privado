<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FΛITHFUL FØREVER</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    overflow: hidden;
}

button,
input,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

/* =========================
   ONBOARDING
========================= */

#onboarding {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

.onboarding-box {
    width: min(90%, 420px);
    text-align: center;
}

.logo {
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 3px;
    margin-bottom: 12px;
}

.subtitle {
    color: #888;
    font-size: 14px;
    margin-bottom: 35px;
}

.name-input {
    width: 100%;
    padding: 15px;
    background: #111;
    color: #fff;
    border: 1px solid #333;
    border-radius: 10px;
    outline: none;
    margin-bottom: 12px;
}

.name-input:focus {
    border-color: #777;
}

.start-button {
    width: 100%;
    padding: 15px;
    background: #fff;
    color: #000;
    border: none;
    border-radius: 10px;
    font-weight: bold;
}

.start-button:active {
    transform: scale(.98);
}

/* =========================
   CHAT
========================= */

#chatApp {
    width: 100%;
    height: 100%;
    display: none;
    flex-direction: column;
    background: #000;
}

/* =========================
   HEADER
========================= */

.header {
    height: 60px;
    flex-shrink: 0;
    border-bottom: 1px solid #222;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    background: #050505;
}

.header-title {
    font-size: 17px;
    font-weight: bold;
    letter-spacing: 1.5px;
}

.connection-status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: #777;
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #555;
}

.status-dot.online {
    background: #00ff66;
}

.status-dot.offline {
    background: #ff3333;
}

/* =========================
   MESSAGES
========================= */

#messages {
    flex: 1;
    overflow-y: auto;
    padding: 15px 12px 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    scroll-behavior: smooth;
}

.empty-chat {
    margin: auto;
    color: #555;
    text-align: center;
    font-size: 13px;
}

.message-row {
    display: flex;
    width: 100%;
}

.message-row.mine {
    justify-content: flex-end;
}

.message-row.theirs {
    justify-content: flex-start;
}

.message {
    max-width: min(80%, 430px);
    padding: 9px 11px 7px;
    border-radius: 13px;
    background: #171717;
    border: 1px solid #222;
    position: relative;
}

.message.mine {
    background: #202020;
}

.sender {
    color: #aaa;
    font-size: 11px;
    margin-bottom: 4px;
}

.message-text {
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 15px;
    line-height: 1.35;
}

.message-footer {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 5px;
    margin-top: 4px;
}

.message-time {
    color: #666;
    font-size: 10px;
}

.message-status {
    color: #777;
    font-size: 12px;
    letter-spacing: -3px;
}

.message-status.read {
    color: #ff3030;
}

/* =========================
   MEDIA
========================= */

.message-image {
    display: block;
    max-width: 100%;
    max-height: 350px;
    border-radius: 9px;
    object-fit: contain;
}

.audio-player {
    width: 230px;
    max-width: 100%;
}

/* =========================
   CONTEXT MENU
========================= */

#contextMenu {
    position: fixed;
    display: none;
    z-index: 2000;
    background: #181818;
    border: 1px solid #333;
    border-radius: 9px;
    min-width: 150px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,.6);
}

.context-item {
    padding: 12px 15px;
    color: #fff;
    font-size: 13px;
}

.context-item:hover {
    background: #292929;
}

.context-delete {
    color: #ff4444;
}

/* =========================
   RECORDING
========================= */

#recordingBar {
    display: none;
    height: 38px;
    flex-shrink: 0;
    background: #111;
    border-top: 1px solid #222;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: #ff4444;
    font-size: 13px;
}

.recording-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ff3333;
}

/* =========================
   INPUT
========================= */

.input-area {
    min-height: 62px;
    flex-shrink: 0;
    border-top: 1px solid #222;
    padding: 8px;
    background: #050505;
    display: flex;
    align-items: flex-end;
    gap: 7px;
}

.input-button {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border: 1px solid #333;
    background: #111;
    color: #fff;
    border-radius: 50%;
    font-size: 18px;
}

.input-button:active {
    background: #222;
}

.input-button.recording {
    background: #441111;
    border-color: #ff3333;
    color: #ff3333;
}

#messageInput {
    flex: 1;
    min-width: 0;
    min-height: 42px;
    max-height: 130px;
    resize: none;
    background: #111;
    color: #fff;
    border: 1px solid #333;
    border-radius: 21px;
    padding: 11px 15px;
    outline: none;
    line-height: 20px;
}

#messageInput:focus {
    border-color: #555;
}

.send-button {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border: none;
    border-radius: 50%;
    background: #fff;
    color: #000;
    font-weight: bold;
}

.send-button:active {
    transform: scale(.95);
}

/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    .header {
        height: 56px;
    }

    .header-title {
        font-size: 15px;
    }

    .message {
        max-width: 85%;
    }

    .message-text {
        font-size: 14px;
    }

    .input-button,
    .send-button {
        width: 40px;
        height: 40px;
    }

    #messageInput {
        min-height: 40px;
    }
}
</style>
</head>

<body>

<!-- =========================
     ONBOARDING
========================= -->

<div id="onboarding">

    <div class="onboarding-box">

        <div class="logo">
            FΛITHFUL FØREVER
        </div>

        <div class="subtitle">
            Enter your name to start chatting
        </div>

        <input
            id="nameInput"
            class="name-input"
            type="text"
            maxlength="30"
            autocomplete="off"
            placeholder="Your name"
        >

        <button
            id="startButton"
            class="start-button"
            type="button"
        >
            Start Chat
        </button>

    </div>

</div>


<!-- =========================
     CHAT APP
========================= -->

<div id="chatApp">

    <header class="header">

        <div class="header-title">
            FΛITHFUL FØREVER
        </div>

        <div class="connection-status">

            <span
                id="statusDot"
                class="status-dot offline"
            ></span>

            <span id="connectionText">
                OFFLINE
            </span>

        </div>

    </header>


    <main id="messages">

        <div
            id="emptyChat"
            class="empty-chat"
        >
            No messages yet
        </div>

    </main>


    <div id="recordingBar">

        <span class="recording-dot"></span>

        <span>
            Recording
        </span>

        <span id="recordingCounter">
            0:00
        </span>

    </div>


    <div class="input-area">

        <button
            id="photoButton"
            class="input-button"
            type="button"
            title="Photo"
        >
            +
        </button>

        <input
            id="photoInput"
            type="file"
            accept="image/*"
            style="display:none"
        >

        <textarea
            id="messageInput"
            rows="1"
            placeholder="Message..."
        ></textarea>

        <button
            id="recordButton"
            class="input-button"
            type="button"
            title="Record audio"
        >
            🎙
        </button>

        <button
            id="sendButton"
            class="send-button"
            type="button"
        >
            ➤
        </button>

    </div>

</div>


<!-- =========================
     CONTEXT MENU
========================= -->

<div id="contextMenu">

    <div
        id="deleteMenuItem"
        class="context-item context-delete"
    >
        Delete for everyone
    </div>

</div>


<script>

/* =========================
   VARIABLES
========================= */

let username =
    localStorage.getItem(
        'chat_username'
    ) || '';

let ws = null;

let reconnectTimer = null;

let selectedMessageId = null;

let mediaRecorder = null;

let audioChunks = [];

let recordingSeconds = 0;

let recordingInterval = null;


/* =========================
   ELEMENTS
========================= */

const onboarding =
    document.getElementById(
        'onboarding'
    );

const chatApp =
    document.getElementById(
        'chatApp'
    );

const nameInput =
    document.getElementById(
        'nameInput'
    );

const startButton =
    document.getElementById(
        'startButton'
    );

const messagesContainer =
    document.getElementById(
        'messages'
    );

const messageInput =
    document.getElementById(
        'messageInput'
    );

const sendButton =
    document.getElementById(
        'sendButton'
    );

const photoButton =
    document.getElementById(
        'photoButton'
    );

const photoInput =
    document.getElementById(
        'photoInput'
    );

const recordButton =
    document.getElementById(
        'recordButton'
    );

const statusDot =
    document.getElementById(
        'statusDot'
    );

const connectionText =
    document.getElementById(
        'connectionText'
    );

const emptyChat =
    document.getElementById(
        'emptyChat'
    );


/* =========================
   CONNECTION
========================= */

function connected() {

    return (
        ws &&
        ws.readyState ===
        WebSocket.OPEN
    );

}


function setConnectionStatus(
    online
) {

    if (online) {

        statusDot.classList.add(
            'online'
        );

        statusDot.classList.remove(
            'offline'
        );

        connectionText.textContent =
            'ONLINE';

    } else {

        statusDot.classList.add(
            'offline'
        );

        statusDot.classList.remove(
            'online'
        );

        connectionText.textContent =
            'OFFLINE';

    }

}


function connect() {

    if (!username) {
        return;
    }

    if (
        ws &&
        (
            ws.readyState ===
            WebSocket.OPEN ||
            ws.readyState ===
            WebSocket.CONNECTING
        )
    ) {
        return;
    }

    const protocol =
        location.protocol === 'https:'
            ? 'wss://'
            : 'ws://';

    ws =
        new WebSocket(
            protocol +
            location.host
        );

    ws.onopen = () => {

        console.log(
            'WebSocket connected'
        );

        setConnectionStatus(
            true
        );

        ws.send(
            JSON.stringify({
                type: 'presence',
                sender: username
            })
        );

    };


    ws.onmessage = event => {

        try {

            const data =
                JSON.parse(
                    event.data
                );

            handleServerMessage(
                data
            );

        } catch (error) {

            console.error(
                'Message error:',
                error
            );

        }

    };


    ws.onclose = () => {

        console.log(
            'WebSocket disconnected'
        );

        setConnectionStatus(
            false
        );

        clearTimeout(
            reconnectTimer
        );

        reconnectTimer =
            setTimeout(
                connect,
                3000
            );

    };


    ws.onerror = error => {

        console.error(
            'WebSocket error:',
            error
        );

    };

}


/* =========================
   SERVER MESSAGES
========================= */

function handleServerMessage(
    data
) {

    if (
        data.type ===
        'history'
    ) {

        renderHistory(
            data.messages || []
        );

        return;
    }


    if (
        data.type ===
        'message'
    ) {

        renderMessage(
            data.message
        );

        scrollToBottom();

        return;
    }


    if (
        data.type ===
        'status'
    ) {

        updateMessageStatus(
            data.id,
            data.status,
            data.readTime
        );

        return;
    }


    if (
        data.type ===
        'delete'
    ) {

        removeMessage(
            data.id
        );

        return;
    }


    if (
        data.type ===
        'presence'
    ) {

        updatePresence(
            data.users || []
        );

    }

}


/* =========================
   HISTORY
========================= */

function renderHistory(
    history
) {

    messagesContainer.innerHTML = '';

    if (
        !history ||
        history.length === 0
    ) {

        messagesContainer.appendChild(
            emptyChat
        );

        return;
    }

    history.forEach(
        message => {

            renderMessage(
                message
            );

        }
    );

    scrollToBottom();

}


/* =========================
   RENDER MESSAGE
========================= */

function renderMessage(
    message
) {

    if (!message) {
        return;
    }

    const old =
        document.querySelector(
            `[data-message-id="${message.id}"]`
        );

    if (old) {
        return;
    }

    if (emptyChat.parentNode) {
        emptyChat.remove();
    }


    const row =
        document.createElement(
            'div'
        );

    row.className =
        'message-row ' +
        (
            message.sender ===
            username
                ? 'mine'
                : 'theirs'
        );


    const bubble =
        document.createElement(
            'div'
        );

    bubble.className =
        'message ' +
        (
            message.sender ===
            username
                ? 'mine'
                : ''
        );

    bubble.dataset.messageId =
        message.id;


    const sender =
        document.createElement(
            'div'
        );

    sender.className =
        'sender';

    sender.textContent =
        message.sender ||
        'Unknown';


    bubble.appendChild(
        sender
    );


    if (
        message.type ===
        'photo'
    ) {

        const image =
            document.createElement(
                'img'
            );

        image.className =
            'message-image';

        image.src =
            message.file;

        image.loading =
            'lazy';

        bubble.appendChild(
            image
        );

    } else if (
        message.type ===
        'audio'
    ) {

        const audio =
            document.createElement(
                'audio'
            );

        audio.className =
            'audio-player';

        audio.controls =
            true;

        audio.preload =
            'metadata';

        audio.src =
            message.file;

        bubble.appendChild(
            audio
        );

    } else {

        const text =
            document.createElement(
                'div'
            );

        text.className =
            'message-text';

        text.textContent =
            message.text || '';

        bubble.appendChild(
            text
        );

    }


    const footer =
        document.createElement(
            'div'
        );

    footer.className =
        'message-footer';


    const time =
        document.createElement(
            'span'
        );

    time.className =
        'message-time';

    time.textContent =
        message.time || '';

    footer.appendChild(
        time
    );


    if (
        message.sender ===
        username
    ) {

        const status =
            document.createElement(
                'span'
            );

        status.className =
            'message-status';

        status.dataset.statusId =
            message.id;

        setStatusDisplay(
            status,
            message.status
        );

        footer.appendChild(
            status
        );

    }


    bubble.appendChild(
        footer
    );


    bubble.addEventListener(
        'contextmenu',
        event => {

            event.preventDefault();

            selectedMessageId =
                message.id;

            showContextMenu(
                event.clientX,
                event.clientY
            );

        }
    );


    row.appendChild(
        bubble
    );

    messagesContainer.appendChild(
        row
    );

}


/* =========================
   STATUS
========================= */

function setStatusDisplay(
    element,
    status
) {

    element.classList.remove(
        'read'
    );

    if (
        status ===
        'read'
    ) {

        element.textContent =
            '✓✓';

        element.classList.add(
            'read'
        );

    } else if (
        status ===
        'delivered'
    ) {

        element.textContent =
            '✓✓';

    } else {

        element.textContent =
            '✓';

    }

}


function updateMessageStatus(
    id,
    status,
    readTime
) {

    const element =
        document.querySelector(
            `[data-status-id="${id}"]`
        );

    if (!element) {
        return;
    }

    setStatusDisplay(
        element,
        status
    );

}


/* =========================
   PRESENCE
========================= */

function updatePresence(
    users
) {

    const otherUsers =
        users.filter(
            user =>
                user !== username
        );

    if (
        otherUsers.length > 0
    ) {

        connectionText.textContent =
            'ONLINE';

    } else {

        connectionText.textContent =
            connected()
                ? 'CONNECTED'
                : 'OFFLINE';

    }

}


/* =========================
   SEND TEXT
========================= */

function sendMessage() {

    const text =
        messageInput.value.trim();

    if (!text) {
        return;
    }

    if (!connected()) {

        alert(
            'Not connected. Please wait...'
        );

        return;
    }


    ws.send(
        JSON.stringify({
            type: 'message',
            text: text,
            sender: username
        })
    );


    messageInput.value = '';

    autoResize();

}


sendButton.addEventListener(
    'click',
    sendMessage
);


messageInput.addEventListener(
    'keydown',
    event => {

        if (
            event.key === 'Enter' &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================
   TEXTAREA SIZE
========================= */

function autoResize() {

    messageInput.style.height =
        'auto';

    messageInput.style.height =
        Math.min(
            messageInput.scrollHeight,
            130
        ) + 'px';

}


messageInput.addEventListener(
    'input',
    autoResize
);


/* =========================
   SCROLL
========================= */

function scrollToBottom() {

    requestAnimationFrame(
        () => {

                 messagesContainer.scrollTop =
                messagesContainer.scrollHeight;

        }
    );

}


/* =========================
   CONTEXT MENU
========================= */

function showContextMenu(
    x,
    y
) {

    const menu =
        document.getElementById(
            'contextMenu'
        );

    menu.style.left =
        x + 'px';

    menu.style.top =
        y + 'px';

    menu.style.display =
        'block';

}


function hideContextMenu() {

    document.getElementById(
        'contextMenu'
    ).style.display =
        'none';

}


document.addEventListener(
    'click',
    hideContextMenu
);


/* =========================
   DELETE
========================= */

function deleteSelectedMessage() {

    hideContextMenu();

    if (!selectedMessageId) {
        return;
    }

    if (!connected()) {
        return;
    }

    ws.send(
        JSON.stringify({
            type: 'delete',
            id: selectedMessageId
        })
    );

    selectedMessageId = null;

}


document
    .getElementById(
        'deleteMenuItem'
    )
    .addEventListener(
        'click',
        deleteSelectedMessage
    );


function removeMessage(
    id
) {

    const message =
        document.querySelector(
            `[data-message-id="${id}"]`
        );

    if (!message) {
        return;
    }

    const row =
        message.closest(
            '.message-row'
        );

    if (row) {
        row.remove();
    }

    if (
        messagesContainer
            .querySelectorAll(
                '.message-row'
            )
            .length === 0
    ) {

        messagesContainer.appendChild(
            emptyChat
        );

    }

}


/* =========================
   PHOTO
========================= */

photoButton.addEventListener(
    'click',
    () => {

        photoInput.click();

    }
);


photoInput.addEventListener(
    'change',
    async event => {

        const file =
            event.target.files[0];

        if (!file) {
            return;
        }

        await uploadFile(
            file,
            'photo'
        );

        event.target.value = '';

    }
);


/* =========================
   UPLOAD
========================= */

async function uploadFile(
    file,
    mediaType
) {

    try {

        if (!connected()) {

            alert(
                'Not connected. Please wait...'
            );

            return;
        }

        const formData =
            new FormData();

        formData.append(
            'file',
            file
        );

        const response =
            await fetch(
                '/upload',
                {
                    method: 'POST',
                    body: formData
                }
            );

        const result =
            await response.json();

        if (
            !result.success ||
            !result.file
        ) {

            alert(
                'Upload failed'
            );

            return;
        }

        ws.send(
            JSON.stringify({
                type: 'media',
                mediaType:
                    mediaType,
                file:
                    result.file,
                sender:
                    username
            })
        );

    } catch (error) {

        console.error(
            'Upload error:',
            error
        );

        alert(
            'Upload failed'
        );

    }

}


/* =========================
   RECORDING
========================= */

recordButton.addEventListener(
    'click',
    toggleRecording
);


async function toggleRecording() {

    if (
        mediaRecorder &&
        mediaRecorder.state ===
            'recording'
    ) {

        stopRecording();

        return;
    }

    try {

        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    audio: true
                });

        audioChunks = [];

        mediaRecorder =
            new MediaRecorder(
                stream
            );

        mediaRecorder.ondataavailable =
            event => {

                if (
                    event.data.size > 0
                ) {

                    audioChunks.push(
                        event.data
                    );

                }

            };

        mediaRecorder.onstop =
            async () => {

                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );

                const blob =
                    new Blob(
                        audioChunks,
                        {
                            type:
                                mediaRecorder
                                    .mimeType ||
                                'audio/webm'
                        }
                    );

                const file =
                    new File(
                        [blob],
                        'audio.webm',
                        {
                            type:
                                blob.type
                        }
                    );

                await uploadFile(
                    file,
                    'audio'
                );

                resetRecordingUI();

            };

        mediaRecorder.start();

        recordingSeconds =
            0;

        recordButton.classList.add(
            'recording'
        );

        document
            .getElementById(
                'recordingBar'
            )
            .style.display =
            'flex';

        updateRecordingCounter();

        recordingInterval =
            setInterval(
                () => {

                    recordingSeconds++;

                    updateRecordingCounter();

                },
                1000
            );

    } catch (error) {

        console.error(
            'Microphone error:',
            error
        );

        alert(
            'Microphone permission is required.'
        );

    }

}


function stopRecording() {

    if (
        mediaRecorder &&
        mediaRecorder.state ===
            'recording'
    ) {

        mediaRecorder.stop();

    }

}


function updateRecordingCounter() {

    const minutes =
        Math.floor(
            recordingSeconds / 60
        );

    const seconds =
        recordingSeconds % 60;

    document
        .getElementById(
            'recordingCounter'
        )
        .textContent =
        minutes +
        ':' +
        String(
            seconds
        ).padStart(
            2,
            '0'
        );

}


function resetRecordingUI() {

    clearInterval(
        recordingInterval
    );

    recordingInterval =
        null;

    recordButton.classList.remove(
        'recording'
    );

    document
        .getElementById(
            'recordingBar'
        )
        .style.display =
        'none';

    recordingSeconds =
        0;

}


/* =========================
   ONBOARDING
========================= */

function startChat() {

    const name =
        nameInput.value.trim();

    if (!name) {

        nameInput.focus();

        return;
    }

    username =
        name;

    localStorage.setItem(
        'chat_username',
        username
    );

    onboarding.style.display =
        'none';

    chatApp.style.display =
        'flex';

    connect();

}


startButton.addEventListener(
    'click',
    startChat
);


nameInput.addEventListener(
    'keydown',
    event => {

        if (
            event.key === 'Enter'
        ) {

            startChat();

        }

    }
);


/* =========================
   PAGE VISIBILITY
========================= */

document.addEventListener(
    'visibilitychange',
    () => {

        if (
            !document.hidden &&
            username &&
            !connected()
        ) {

            connect();

        }

    }
);


/* =========================
   START
========================= */

window.addEventListener(
    'beforeunload',
    () => {

        if (
            ws &&
            ws.readyState ===
                WebSocket.OPEN
        ) {

            ws.close();

        }

    }
);


/* =========================
   EXISTING USER
========================= */

if (username) {

    onboarding.style.display =
        'none';

    chatApp.style.display =
        'flex';

    connect();

}

</script>

</body>
</html>
