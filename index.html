<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault Pro • Videos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060606;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh}
.login-wrap{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;background:radial-gradient(ellipse at 50% -20%, rgba(255,0,30,0.28) 0%, transparent 60%)}
.login-card{width:100%;max-width:380px;text-align:center}
.logo{width:88px;height:88px;background:linear-gradient(180deg,#1e1e1e,#0a0a0a);border:1px solid #330000;border-radius:22px;display:flex;align-items:center;justify-content:center;margin:0 auto 30px;box-shadow:0 0 0 1px #ff0022 inset,0 12px 50px rgba(255,0,34,0.4)}
h1{font-size:28px;font-weight:900;letter-spacing:2.5px;text-transform:uppercase;background:linear-gradient(180deg,#fff,#999);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.sub{color:#555;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:40px}
input{width:100%;padding:18px;border-radius:14px;border:1px solid #1c1c1c;background:#0e0e0e;color:#fff;font-size:15px;text-align:center}
.btn{width:100%;padding:18px;border-radius:14px;border:none;background:linear-gradient(180deg,#ff0033,#cc0011);color:#fff;font-weight:900;font-size:16px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;margin-top:12px;box-shadow:0 4px 0 #880000,0 12px 32px rgba(255,0,34,0.55)}
#msg{color:#ff3355;font-size:13px;margin-top:16px;min-height:20px}

/* Plataforma */
#plataforma{display:none;min-height:100vh;background:#050505}
.topbar{position:sticky;top:0;z-index:10;background:rgba(5,5,5,0.95);backdrop-filter:blur(12px);border-bottom:1px solid #1a1a1a;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand{font-weight:900;letter-spacing:2px;font-size:18px}
.brand span{color:#ff0022}
.salas-nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sala-btn{padding:8px 14px;border-radius:10px;border:1px solid #222;background:#111;color:#888;font-size:12px;font-weight:700;cursor:pointer;transition:0.15s}
.sala-btn.active{background:#ff0022;color:#fff;border-color:#ff0022;box-shadow:0 0 12px rgba(255,0,34,0.5)}
.sala-btn:hover{border-color:#ff0022;color:#fff}
.user-area{display:flex;align-items:center;gap:10px}
.badge{background:#1a0000;border:1px solid #330000;color:#ff0022;padding:4px 10px;border-radius:8px;font-size:11px}

.content{padding:20px;max-width:1400px;margin:auto}
.grid-videos{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.video-window{background:linear-gradient(180deg,#151515,#0f0f0f);border:1px solid #1e1e1e;border-radius:14px;overflow:hidden;cursor:pointer;transition:0.2s;position:relative}
.video-window:hover{border-color:#ff0022;transform:translateY(-2px);box-shadow:0 10px 30px rgba(255,0,34,0.2)}
.thumb{aspect-ratio:16/9;background:#000;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb iframe{width:100%;height:100%;border:none;pointer-events:none}
.thumb .play-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;opacity:0;transition:0.2s}
.video-window:hover .play-overlay{opacity:1}
.play-btn{width:56px;height:56px;background:rgba(255,0,34,0.9);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(255,0,34,0.6)}
.info{padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.info b{font-size:13px}
.info small{color:#666;font-size:11px}

.pagination{display:flex;justify-content:center;align-items:center;gap:10px;margin:30px 0;flex-wrap:wrap}
.pag-btn{padding:10px 18px;border-radius:10px;border:1px solid #222;background:#111;color:#fff;cursor:pointer;font-weight:700}
.pag-btn:disabled{opacity:0.3;cursor:not-allowed}
.pag-btn.active{background:#ff0022;border-color:#ff0022}
.pag-info{color:#555;font-size:13px}

/* Modal player */
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal-box{width:100%;max-width:1100px;background:#0e0e0e;border:1px solid #222;border-radius:16px;overflow:hidden}
.modal-top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #1a1a1a}
.modal-player{aspect-ratio:16/9;background:#000}
.modal-player iframe{width:100%;height:100%;border:none}
.close-btn{background:#1a1a1a;border:1px solid #222;color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer}
</style>
</head>
<body>

<div class="login-wrap" id="login">
<div class="login-card">
<div class="logo"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ff0022" stroke-width="2.2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/><circle cx="12" cy="16" r="1" fill="#ff0022" stroke="none"/></svg></div>
<h1>Acceso</h1>
<p class="sub">AES-256 • 14 por página • Ventanas</p>
<input id="keyInput" type="password" placeholder="Pon tu key">
<button class="btn" onclick="entrar()">Entrar</button>
<p id="msg"></p>
</div>
</div>

<div id="plataforma">
<div class="topbar">
<div class="brand">VAULT <span>PRO</span></div>
<div class="salas-nav" id="salasNav"></div>
<div class="user-area"><span class="badge" id="userBadge"></span><button class="sala-btn" onclick="salir()">Salir</button></div>
</div>
<div class="content">
<div id="grid" class="grid-videos"></div>
<div class="pagination" id="pagination"></div>
</div>
</div>

<div class="modal" id="modal" onclick="cerrarModal(event)">
<div class="modal-box">
<div class="modal-top"><b id="modalTitle">Video</b><button class="close-btn" onclick="cerrarModal()">✕ Cerrar</button></div>
<div class="modal-player"><iframe id="playerFrame" allowfullscreen></iframe></div>
</div>
</div>

<script>
// --- Seguridad sin keys hardcodeadas ---
async function hashKey(k){
  const enc = new TextEncoder().encode(k);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function megaToEmbed(url){
  if(!url) return '';
  url = url.trim();
  // Si ya es embed, dejarlo
  if(url.includes('/embed/')) return url;
  // Convertir /file/ a /embed/
  return url.replace('/file/', '/embed/');
}

let vaultData = {};
let salaActual = '';
let paginaActual = 1;
const POR_PAGINA = 14;

async function entrar(){
  const k = document.getElementById('keyInput').value.trim();
  if(!k) return;
  document.getElementById('msg').innerText='Verificando...';
  try{
    const res = await fetch("/api/keys.json");
    if(!res.ok) throw new Error('API no disponible');
    const keys = await res.json();
    if(keys.length===0){ document.getElementById('msg').innerText='No hay keys. Crea una en /admin'; return; }
    if(k==="ADMIN-INIT-2026"){ localStorage.setItem('vault_session_key', k); localStorage.setItem('vault_session_nombre','ADMIN'); iniciarPlataforma(); return; }
    const h = await hashKey(k);
    const found = keys.find(x=>x.key_hash===h);
    if(!found){ document.getElementById('msg').innerText='Key no existe'; return; }
    if(found.activo===false){ document.getElementById('msg').innerText='Key revocada'; return; }
    if(found.expira && new Date() > new Date(found.expira)){ document.getElementById('msg').innerText='Key expirada'; return; }
    localStorage.setItem('vault_session_key', k);
    localStorage.setItem('vault_session_nombre', found.nombre||'Usuario');
    iniciarPlataforma();
  }catch(e){ document.getElementById('msg').innerText='Error: '+e.message; }
}

async function iniciarPlataforma(){
  document.getElementById('login').style.display='none';
  document.getElementById('plataforma').style.display='block';
  document.getElementById('userBadge').innerText = localStorage.getItem('vault_session_nombre')||'';
  
  // Cargar videos
  try{
    const res = await fetch("/api/videos_enc.json");
    if(!res.ok) throw new Error('No hay videos aún');
    const enc = await res.text();
    if(!enc) throw new Error('Vault vacío');

    let master = localStorage.getItem('vault_master_session');
    if(!master){
      try{ const mRes = await fetch("/api/master_key"); if(mRes.ok) master = await mRes.text(); }catch(e){}
    }
    if(!master){ master = prompt('🔐 Clave maestra:'); if(!master) return; }

    let data = null; let txt="";
    try{ if(typeof CryptoJS!=='undefined'){ const bytes=CryptoJS.AES.decrypt(enc,master); txt=bytes.toString(CryptoJS.enc.Utf8); if(txt) data=JSON.parse(txt); } }catch(e){}
    if(!data){ try{ data=JSON.parse(enc); }catch(e){} }
    if(!data) throw new Error('No se pudo desencriptar. Activa Auto-desbloqueo en /admin');

    vaultData = data;
    const salas = Object.keys(data);
    if(salas.length===0) throw new Error('Vault vacío');
    
    salaActual = salas[0];
    renderSalas();
    renderVideos();
  }catch(e){
    document.getElementById('grid').innerHTML='<div style="color:#ff3355;background:#1a0000;padding:20px;border-radius:12px">'+e.message+'</div>';
  }
}

function renderSalas(){
  const nav = document.getElementById('salasNav');
  const salas = Object.keys(vaultData);
  nav.innerHTML = salas.map((sala, idx)=>{
    const num = idx+1;
    const active = sala===salaActual ? 'active' : '';
    // Mostrar como Sala 1, Sala 2, etc, pero con nombre real en tooltip
    return `<button class="sala-btn ${active}" onclick="cambiarSala('${sala.replace(/'/g, "\'")}')" title="${sala}">${sala.match(/^\d+$/) ? 'Sala '+sala : (sala.length>12 ? sala.substring(0,12)+'...' : sala)} (${vaultData[sala].length})</button>`;
  }).join('') + (salas.length>9 ? `<span class="badge">${salas.length} salas</span>` : '');
}

function cambiarSala(sala){
  salaActual = sala;
  paginaActual = 1;
  renderSalas();
  renderVideos();
}

function renderVideos(){
  const grid = document.getElementById('grid');
  const pag = document.getElementById('pagination');
  const videos = vaultData[salaActual] || [];
  const totalPaginas = Math.ceil(videos.length / POR_PAGINA);
  if(paginaActual>totalPaginas) paginaActual = totalPaginas || 1;
  if(paginaActual<1) paginaActual=1;

  const inicio = (paginaActual-1)*POR_PAGINA;
  const fin = inicio+POR_PAGINA;
  const paginaVideos = videos.slice(inicio, fin);

  if(paginaVideos.length===0){
    grid.innerHTML='<p style="color:#555;text-align:center;padding:40px">No hay videos en esta sala</p>';
    pag.innerHTML='';
    return;
  }

  grid.innerHTML = paginaVideos.map((url, i)=>{
    const idx = inicio + i + 1;
    const embed = megaToEmbed(url);
    return `
    <div class="video-window" onclick="abrirVideo('${embed.replace(/'/g, "\'")}', 'Video ${idx} - ${salaActual}')">
      <div class="thumb">
        <iframe src="${embed}" loading="lazy"></iframe>
        <div class="play-overlay"><div class="play-btn">▶</div></div>
      </div>
      <div class="info"><b>Video ${idx}</b><small>${salaActual}</small></div>
    </div>`;
  }).join('');

  // Paginación
  let pagHtml = '';
  pagHtml += `<button class="pag-btn" ${paginaActual===1?'disabled':''} onclick="cambiarPagina(${paginaActual-1})">‹ Anterior</button>`;
  for(let p=1; p<=totalPaginas; p++){
    if(totalPaginas>7 && Math.abs(p-paginaActual)>2 && p!==1 && p!==totalPaginas){
      if(p===2 || p===totalPaginas-1) pagHtml+=`<span style="color:#333">...</span>`;
      continue;
    }
    pagHtml += `<button class="pag-btn ${p===paginaActual?'active':''}" onclick="cambiarPagina(${p})">${p}</button>`;
  }
  pagHtml += `<button class="pag-btn" ${paginaActual===totalPaginas?'disabled':''} onclick="cambiarPagina(${paginaActual+1})">Siguiente ›</button>`;
  pagHtml += `<span class="pag-info">${videos.length} videos • Página ${paginaActual}/${totalPaginas}</span>`;
  pag.innerHTML = pagHtml;
}

function cambiarPagina(p){
  paginaActual = p;
  renderVideos();
  window.scrollTo({top:0, behavior:'smooth'});
}

function abrirVideo(embedUrl, titulo){
  document.getElementById('playerFrame').src = embedUrl;
  document.getElementById('modalTitle').innerText = titulo;
  document.getElementById('modal').classList.add('open');
}

function cerrarModal(e){
  if(e && e.target.id!=='modal' && e.target.className!=='close-btn') return;
  if(!e || e.target.id==='modal' || e.target.className==='close-btn'){
    document.getElementById('modal').classList.remove('open');
    document.getElementById('playerFrame').src = '';
  }
}

function salir(){ localStorage.removeItem('vault_session_key'); location.reload(); }
</script>
</body>
</html>
