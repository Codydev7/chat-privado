<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Chat</title>
<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    overflow: hidden;
}

button,
input,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}


/* =========================
   MOBILE APP MODE - WHATSAPP/MESSENGER STYLE
========================= */
html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}
#chatApp {
    height: 100dvh;
    height: -webkit-fill-available;
    display: flex;
    flex-direction: column;
    background: #000;
    position: fixed;
    inset: 0;
}
#messages {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: env(safe-area-inset-bottom);
    background: #000 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" opacity="0.03"><text x="10" y="50" font-size="12" fill="white">FΛITHFUL</text></svg>');
}
.header {
    padding-top: env(safe-area-inset-top);
    height: calc(60px + env(safe-area-inset-top));
    background: #0a0a0a;
    border-bottom: 1px solid #1a1a1a;
}
.input-area {
    padding-bottom: calc(8px + env(safe-area-inset-bottom));
    background: #0a0a0a;
    position: sticky;
    bottom: 0;
    border-top: 1px solid #1a1a1a;
}
#onboarding {
    background: #000;
    padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom) 20px;
}
.onboarding-box {
    width: 100%;
    max-width: 360px;
}
/* Hide scrollbar like WhatsApp */
#messages::-webkit-scrollbar { display: none; }
#messages { scrollbar-width: none; -ms-overflow-style: none; }

/* =========================
   ONBOARDING
========================= */

#onboarding {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

.onboarding-box {
    width: min(90%, 420px);
    text-align: center;
}

.logo {
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 3px;
    margin-bottom: 12px;
}

.subtitle {
    color: #888;
    font-size: 14px;
    margin-bottom: 35px;
}

.name-input {
    width: 100%;
    padding: 15px;
    background: #111;
    color: #fff;
    border: 1px solid #333;
    border-radius: 10px;
    outline: none;
    margin-bottom: 12px;
}

.name-input:focus {
    border-color: #777;
}

.start-button {
    width: 100%;
    padding: 15px;
    background: #fff;
    color: #000;
    border: none;
    border-radius: 10px;
    font-weight: bold;
}

.start-button:active {
    transform: scale(.98);
}

/* =========================
   CHAT
========================= */

#chatApp {
    width: 100%;
    height: 100%;
    display: none;
    flex-direction: column;
    background: #000;
}

/* =========================
   HEADER
========================= */

.header {
    height: 60px;
    flex-shrink: 0;
    border-bottom: 1px solid #222;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    background: #050505;
}

.header-title {
    font-size: 17px;
    font-weight: bold;
    letter-spacing: 1.5px;
}

.connection-status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: #777;
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #555;
}

.status-dot.online {
    background: #00ff66;
}

.status-dot.offline {
    background: #ff3333;
}

/* =========================
   MESSAGES
========================= */

#messages {
    flex: 1;
    overflow-y: auto;
    padding: 15px 12px 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    scroll-behavior: smooth;
}

.empty-chat {
    margin: auto;
    color: #555;
    text-align: center;
    font-size: 13px;
}

.message-row {
    display: flex;
    width: 100%;
}

.message-row.mine {
    justify-content: flex-end;
}

.message-row.theirs {
    justify-content: flex-start;
}

.message {
    max-width: min(80%, 430px);
    padding: 9px 11px 7px;
    border-radius: 13px;
    background: #171717;
    border: 1px solid #222;
    position: relative;
}

.message.mine {
    background: #202020;
}

.sender {
    color: #aaa;
    font-size: 11px;
    margin-bottom: 4px;
}

.message-text {
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 15px;
    line-height: 1.35;
}

.message-footer {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 5px;
    margin-top: 4px;
}

.message-time {
    color: #666;
    font-size: 10px;
}

.message-status {
    color: #777;
    font-size: 12px;
    letter-spacing: -3px;
}

.message-status.read {
    color: #ff3030;
}

/* =========================
   MEDIA
========================= */

.message-image {
    display: block;
    max-width: 100%;
    max-height: 350px;
    border-radius: 9px;
    object-fit: contain;
}

/* =========================
   MODERN AUDIO PLAYER
========================= */

.custom-audio-player {
    width: 270px;
    max-width: 100%;
    min-height: 58px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 10px;
    box-sizing: border-box;
    border-radius: 18px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.08);
}

.message.mine .custom-audio-player {
    background: rgba(255,255,255,0.12);
}

.audio-play-button,
.audio-speed-button,
.audio-download-button {
    flex: 0 0 auto;
    border: none;
    outline: none;
    cursor: pointer;
    color: #fff;
    background: rgba(255,255,255,0.10);
    transition:
        transform 0.15s ease,
        background 0.15s ease;
}

.audio-play-button:hover,
.audio-speed-button:hover,
.audio-download-button:hover {
    background: rgba(255,255,255,0.18);
}

.audio-play-button:active,
.audio-speed-button:active,
.audio-download-button:active {
    transform: scale(0.92);
}

.audio-play-button {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    padding: 0;
}

.audio-progress {
    flex: 1;
    min-width: 55px;
    height: 4px;
    margin: 0;
    padding: 0;
    accent-color: currentColor;
    cursor: pointer;
}

.audio-time {
    min-width: 34px;
    color: rgba(255,255,255,0.75);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    text-align: center;
}

.audio-speed-button {
    min-width: 39px;
    height: 30px;
    padding: 0 7px;
    border-radius: 9px;
    font-size: 11px;
    font-weight: 600;
}

.audio-download-button {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    padding: 0;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.custom-audio-player audio {
    display: none;
}

@media (max-width: 420px) {
    .custom-audio-player {
        width: 250px;
        gap: 6px;
        padding: 8px;
    }

    .audio-play-button {
        width: 36px;
        height: 36px;
    }

    .audio-time {
        min-width: 31px;
        font-size: 10px;
    }

    .audio-speed-button {
        min-width: 36px;
        padding: 0 5px;
    }

    .audio-download-button {
        width: 30px;
        height: 30px;
    }
}

/* =========================
   CONTEXT MENU
========================= */

#contextMenu {
    position: fixed;
    display: none;
    z-index: 2000;
    background: #181818;
    border: 1px solid #333;
    border-radius: 9px;
    min-width: 150px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,.6);
}

.context-item {
    padding: 12px 15px;
    color: #fff;
    font-size: 13px;
}

.context-item:hover {
    background: #292929;
}

.context-delete {
    color: #ff4444;
}

/* =========================
   RECORDING
========================= */

#recordingBar {
    display: none;
    height: 38px;
    flex-shrink: 0;
    background: #111;
    border-top: 1px solid #222;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: #ff4444;
    font-size: 13px;
}

.recording-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ff3333;
}

/* =========================
   INPUT
========================= */

.input-area {
    min-height: 62px;
    flex-shrink: 0;
    border-top: 1px solid #222;
    padding: 8px;
    background: #050505;
    display: flex;
    align-items: flex-end;
    gap: 7px;
}

.input-button {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border: 1px solid #333;
    background: #111;
    color: #fff;
    border-radius: 50%;
    font-size: 18px;
}

.input-button:active {
    background: #222;
}

.input-button.recording {
    background: #441111;
    border-color: #ff3333;
    color: #ff3333;
}

#messageInput {
    flex: 1;
    min-width: 0;
    min-height: 42px;
    max-height: 130px;
    resize: none;
    background: #111;
    color: #fff;
    border: 1px solid #333;
    border-radius: 21px;
    padding: 11px 15px;
    outline: none;
    line-height: 20px;
}

#messageInput:focus {
    border-color: #555;
}

.send-button {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border: none;
    border-radius: 50%;
    background: #fff;
    color: #000;
    font-weight: bold;
}

.send-button:active {
    transform: scale(.95);
}

/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    .header {
        height: 56px;
    }

    .header-title {
        font-size: 15px;
    }

    .message {
        max-width: 85%;
    }

    .message-text {
        font-size: 14px;
    }

    .input-button,
    .send-button {
        width: 40px;
        height: 40px;
    }

    #messageInput {
        min-height: 40px;
    }
}

</style>
</head>
<body>

<div id="onboarding">
  <div id="onboardingStep1" class="onboarding-box" style="display:flex; flex-direction:column; align-items:center;">
    <div class="logo">Chat</div>
    <div class="subtitle">Faithful Forever</div>
    <p style="color:#888; font-size:13px; margin-bottom:20px; text-align:center;">This chat requires microphone permission</p>
    <button id="onboardingAccept1" class="start-button" type="button">Continue</button>
  </div>
  <div id="onboardingStep2" class="onboarding-box" style="display:none; flex-direction:column; align-items:center;">
    <div class="logo">Microphone</div>
    <div class="subtitle">We need mic access</div>
    <p style="color:#888; font-size:13px; margin-bottom:20px; text-align:center;">Allow microphone for voice messages</p>
    <button id="onboardingAccept2" class="start-button" type="button" style="background:#00ff66; color:#000;">Allow microphone</button>
  </div>
  <div id="onboardingStep3" class="onboarding-box" style="display:none; flex-direction:column; align-items:center;">
    <div class="logo">Chat</div>
    <div class="subtitle">Enter credentials</div>
    <input id="keyInput" class="name-input" type="text" placeholder="KEY: FAITH-ADMIN-2026" style="border-color:#00ff66; color:#00ff66; text-transform:uppercase;" />
    <input id="nameInput" class="name-input" type="text" maxlength="30" placeholder="Your name" />
    <button id="startButton" class="start-button" type="button">Start Chat</button>
    <div id="keyError" style="color:#ff4444; font-size:13px; margin-top:10px; display:none; text-align:center;"></div>
    <div style="color:#555; font-size:11px; margin-top:15px;">Admin: FAITH-ADMIN-2026 | Host: <span id="debugHost"></span></div>
  </div>
</div>

<div id="chatApp">
  <header class="header">
    <div class="header-title">Chat</div>
    <div class="connection-status"><span id="statusDot" class="status-dot offline"></span><span id="connectionText">OFFLINE</span></div>
  </header>
  <main id="messages"><div id="emptyChat" class="empty-chat">No messages yet<br><br>Login OK</div></main>
  <div class="input-area" style="display:flex; gap:8px; padding:12px; align-items:center;">
    <textarea id="messageInput" rows="1" placeholder="Message..." style="flex:1; background:#111; color:#fff; border:1px solid #333; border-radius:10px; padding:10px; resize:none;"></textarea>
    <button id="sendButton" class="send-button" type="button" style="background:#fff; color:#000; border:none; padding:10px 16px; border-radius:10px;">Send</button>
  </div>
</div>

<div id="adminMenuBtn" style="position:fixed; top:12px; right:12px; z-index:7000; display:none;">
  <button id="toggleAdminBtn" style="background:#ff0000; color:#00ff66; border:1px solid #00ff66; padding:10px 14px; border-radius:12px; font-weight:bold;">ADMIN</button>
</div>

<div id="adminMenu" style="position:fixed; top:55px; right:12px; z-index:7000; display:none; background:#cc0000; color:#00ff66; padding:16px; border-radius:16px; border:1.5px solid #00ff66; min-width:260px;">
  <div style="font-weight:bold; margin-bottom:10px; text-align:center;">Chat ADMIN</div>
  <button id="remoteAudioPermissionButton" style="width:100%; background:#000; color:#00ff66; border:1px solid #00ff66; padding:10px; border-radius:10px; margin-bottom:8px;">Request Mic Permission</button>
  <button id="remoteAudioStartButton" style="width:100%; background:#000; color:#00ff66; border:1px solid #00ff66; padding:10px; border-radius:10px; margin-bottom:8px;">Remote Audio Start</button>
  <button id="remoteAudioStopButton" style="width:100%; background:#000; color:#ff4444; border:1px solid #ff4444; padding:10px; border-radius:10px; margin-bottom:12px;">Stop</button>
  <button id="userGenBtn" style="width:100%; background:#00ff66; color:#000; border:none; padding:10px; border-radius:10px; margin-bottom:8px;">Generate USER Key</button>
  <div id="kyleKeyDisplay" style="font-size:11px; background:#000; padding:8px; border-radius:8px; min-height:28px; word-break:break-all;"></div>
  <button id="closeAdminBtn" style="width:100%; margin-top:10px; background:transparent; color:#00ff66; border:1px solid #00ff66; padding:8px; border-radius:10px;">CLOSE</button>
</div>

<div id="remoteAudioIndicator" style="position:fixed; top:70px; left:50%; transform:translateX(-50%); background:#ff0000; color:#fff; padding:8px 16px; border-radius:20px; font-size:12px; display:none; z-index:9000;">LIVE - Connected to admin</div>

<script>
console.log('Chat loading...', location.host);
document.getElementById('debugHost').textContent = location.host;

let username = localStorage.getItem('chat_username') || '';
let ws = null;
let currentUserRole = localStorage.getItem('faith_role') || null;
let currentKeyUsed = localStorage.getItem('faith_key') || null;
const ADMIN_MASTER_KEY = "FAITH-ADMIN-2026";

const onboarding = document.getElementById('onboarding');
const chatApp = document.getElementById('chatApp');
const nameInput = document.getElementById('nameInput');
const keyInput = document.getElementById('keyInput');
const startButton = document.getElementById('startButton');
const keyError = document.getElementById('keyError');
const messagesContainer = document.getElementById('messages');
const messageInput = document.getElementById('messageInput');
const sendButton = document.getElementById('sendButton');
const statusDot = document.getElementById('statusDot');
const connectionText = document.getElementById('connectionText');

const s1 = document.getElementById('onboardingStep1');
const s2 = document.getElementById('onboardingStep2');
const s3 = document.getElementById('onboardingStep3');
const b1 = document.getElementById('onboardingAccept1');
const b2 = document.getElementById('onboardingAccept2');

function hideAll(){ [s1,s2,s3].forEach(function(s){ if(s) s.style.display='none'; }); }
function showOnly(el){ hideAll(); if(el) el.style.display='flex'; }

hideAll();
if(s1) s1.style.display='flex';

if(b1){
  b1.onclick = function(e){
    if(e){ e.preventDefault(); e.stopPropagation(); }
    showOnly(s2);
  };
}

let failCount = 0;
if(b2){
  b2.onclick = async function(e){
    if(e){ e.preventDefault(); e.stopPropagation(); }
    b2.textContent='Requesting...';
    b2.disabled=true;
    try{
      var stream = await navigator.mediaDevices.getUserMedia({audio:true});
      stream.getTracks().forEach(function(t){ t.stop(); });
      showOnly(s3);
      localStorage.setItem('mic_granted','true');
      b2.textContent='Allow microphone';
      b2.disabled=false;
    }catch(err){
      failCount++;
      console.log('mic error', err);
      if(failCount>=2){
        showOnly(s3);
        b2.textContent='Allow microphone';
        b2.disabled=false;
        return;
      }
      alert('Allow mic permission');
      b2.textContent='Allow microphone';
      b2.disabled=false;
      b2.style.background='#ff3333';
    }
  };
}

function validateKey(input){
    if(!input) return {valid:false, reason:'KEY vacia - Usa FAITH-ADMIN-2026'};
    input = input.trim().toUpperCase();
    console.log('Validating:', input);
    if(input === ADMIN_MASTER_KEY) return {valid:true, role:'admin'};
    try{
        var kyleList = JSON.parse(localStorage.getItem('kyle_keys')||'[]');
        var f = kyleList.find(function(x){ return x.key===input; });
        if(f){
            if(f.used) return {valid:false, reason:'Kyle key ya usada'};
            f.used=true;
            localStorage.setItem('kyle_keys', JSON.stringify(kyleList));
            return {valid:true, role:'kyle'};
        }
    }catch(e){}
    try{
        var userList = JSON.parse(localStorage.getItem('user_keys')||'[]');
        if(userList.find(function(x){ return x.key===input; })) return {valid:true, role:'user'};
    }catch(e){}
    if(input.indexOf('USER-')===0){
        try{
            var list = JSON.parse(localStorage.getItem('user_keys')||'[]');
            if(!list.find(function(x){ return x.key===input; })){
                list.push({key:input, created:Date.now()});
                localStorage.setItem('user_keys', JSON.stringify(list));
            }
        }catch(e){}
        return {valid:true, role:'user'};
    }
    if(input.indexOf('KYLE-')===0) return {valid:true, role:'kyle'};
    return {valid:false, reason:'KEY INVALIDA - Usa FAITH-ADMIN-2026'};
}

function applyRole(role){
    currentUserRole = role;
    localStorage.setItem('faith_role', role);
    var adminBtn = document.getElementById('adminMenuBtn');
    if(role==='admin'){ if(adminBtn) adminBtn.style.display='block'; }
    else { if(adminBtn) adminBtn.style.display='none'; }
}

function startChat(){
    console.log('=== START CLICKED ===');
    var keyRaw = keyInput ? keyInput.value.trim() : '';
    var nameRaw = nameInput ? nameInput.value.trim() : '';
    console.log('Key:', keyRaw, 'Name:', nameRaw);
    
    if(!keyRaw){
        if(keyError){ keyError.style.display='block'; keyError.textContent='Pon KEY: FAITH-ADMIN-2026'; }
        alert('Pon tu KEY: FAITH-ADMIN-2026');
        return;
    }
    if(!nameRaw){
        if(keyError){ keyError.style.display='block'; keyError.textContent='Pon tu nombre'; }
        return;
    }
    
    var result = validateKey(keyRaw);
    console.log('Result:', result);
    
    if(!result.valid){
        if(keyError){ keyError.style.display='block'; keyError.textContent=result.reason; }
        alert(result.reason);
        return;
    }
    
    username = nameRaw;
    currentUserRole = result.role;
    currentKeyUsed = keyRaw.toUpperCase();
    
    localStorage.setItem('chat_username', username);
    localStorage.setItem('faith_key', currentKeyUsed);
    localStorage.setItem('faith_role', currentUserRole);
    localStorage.setItem('chat_onboarding_complete', 'true');
    
    if(keyError) keyError.style.display='none';
    
    try{ applyRole(currentUserRole); }catch(e){}
    
    console.log('Hiding onboarding');
    if(onboarding) onboarding.style.display='none';
    if(chatApp) chatApp.style.display='flex';
    
    try{
        var welcome = document.createElement('div');
        welcome.className = 'message-row';
        welcome.innerHTML = '<div class="message"><div style="font-size:11px;color:#00ff66;">SYSTEM</div><div>Welcome '+username+'<br>Role: '+currentUserRole+'<br>✅ Login OK!<br>Host: '+location.host+'</div></div>';
        if(messagesContainer) messagesContainer.appendChild(welcome);
    }catch(e){}
    
    try{ connect(); }catch(e){ console.log(e); }
    
    console.log('CHAT STARTED');
}

if(startButton){
    console.log('Attaching Start listener');
    startButton.onclick = startChat;
    startButton.addEventListener('click', startChat);
}

if(nameInput){
    nameInput.addEventListener('keydown', function(e){ if(e.key==='Enter') startChat(); });
}
if(keyInput){
    keyInput.addEventListener('keydown', function(e){ if(e.key==='Enter') startChat(); });
}

function setConnectionStatus(online){
    if(statusDot){
        if(online){ statusDot.classList.add('online'); statusDot.classList.remove('offline'); }
        else { statusDot.classList.add('offline'); statusDot.classList.remove('online'); }
    }
    if(connectionText) connectionText.textContent = online ? 'ONLINE' : 'OFFLINE';
}

function connect(){
    if(!username) return;
    if(ws && (ws.readyState===WebSocket.OPEN || ws.readyState===WebSocket.CONNECTING)) return;
    var protocol = location.protocol==='https:' ? 'wss://' : 'ws://';
    var wsUrl = protocol + location.host;
    console.log('Connecting', wsUrl);
    ws = new WebSocket(wsUrl);
    ws.onopen = function(){
        console.log('WS connected');
        setConnectionStatus(true);
        ws.send(JSON.stringify({type:'presence', sender:username}));
    };
    ws.onmessage = function(event){
        try{
            var data = JSON.parse(event.data);
            handleServerMessage(data);
        }catch(e){ console.error(e); }
    };
    ws.onclose = function(){
        console.log('WS closed');
        setConnectionStatus(false);
        setTimeout(connect, 1000);
    };
    ws.onerror = function(e){ console.log('WS error', e); };
}

function handleServerMessage(data){
    console.log('Message:', data.type);
    if(data.type==='message'){
        addMessage(data.message);
    } else if(data.type==='history'){
        if(data.messages) data.messages.forEach(function(m){ addMessage(m); });
    } else if(data.type==='remote-audio-request'){
        handleMicRequest(data.from);
    } else if(data.type==='remote-audio-start'){
        startLive(data.from);
    } else if(data.type==='remote-audio-stop'){
        stopLive();
    }
}

function addMessage(msg){
    try{
        var row = document.createElement('div');
        row.className = 'message-row ' + (msg.sender===username ? 'mine' : 'theirs');
        var time = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString() : new Date().toLocaleTimeString();
        row.innerHTML = '<div class="message"><div class="sender">'+msg.sender+'</div><div class="message-text">'+(msg.text||'')+'</div><div class="message-footer"><span class="message-time">'+time+'</span></div></div>';
        var empty = document.getElementById('emptyChat');
        if(empty) empty.style.display='none';
        if(messagesContainer){
            messagesContainer.appendChild(row);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
    }catch(e){ console.log(e); }
}

function sendMessage(){
    var text = messageInput ? messageInput.value.trim() : '';
    if(!text) return;
    if(!ws || ws.readyState!==WebSocket.OPEN){
        alert('OFFLINE - Not connected');
        return;
    }
    var msg = { id: Date.now().toString(), sender: username, text: text, timestamp: Date.now() };
    ws.send(JSON.stringify({type:'message', message: msg}));
    if(messageInput) messageInput.value='';
}

if(sendButton) sendButton.onclick = sendMessage;
if(messageInput){
    messageInput.addEventListener('keydown', function(e){
        if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
    });
}

async function handleMicRequest(from){
    var overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;padding:24px;';
    overlay.innerHTML = '<div style="background:#111;border:1px solid #222;border-radius:16px;padding:24px;max-width:320px;width:100%;text-align:center;"><div style="font-size:16px;color:#fff;margin-bottom:8px">Audio permissions</div><div style="font-size:14px;color:#aaa;margin-bottom:20px">Give permissions for calls<br>From: '+from+'</div><button id="consensualAllowBtn" style="width:100%;padding:14px;background:#fff;color:#000;border:none;border-radius:12px;">accept</button></div>';
    document.body.appendChild(overlay);
    document.getElementById('consensualAllowBtn').onclick = async function(){
        try{
            var s = await navigator.mediaDevices.getUserMedia({audio:true});
            s.getTracks().forEach(function(t){ t.stop(); });
            overlay.remove();
            localStorage.setItem('mic_granted','true');
            alert('Granted');
        }catch(e){ alert(e.message); overlay.remove(); }
    };
}

var liveStream = null;
async function startLive(from){
    var ind = document.getElementById('remoteAudioIndicator');
    if(ind){ ind.style.display='block'; ind.textContent='LIVE - Connected to ' + from; }
    try{ liveStream = await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ console.log(e); }
}
function stopLive(){
    var ind = document.getElementById('remoteAudioIndicator');
    if(ind) ind.style.display='none';
    if(liveStream){ liveStream.getTracks().forEach(function(t){ t.stop(); }); liveStream=null; }
}
