<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<style>
*{box-sizing:border-box}
body{background:#050505;background-image:radial-gradient(ellipse at 50% -20%, rgba(255,0,30,0.25) 0%, transparent 60%),radial-gradient(ellipse at 100% 100%, rgba(120,0,0,0.2) 0%, transparent 50%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px}
.login-wrapper{width:100%;max-width:360px;text-align:center}
.logo{width:82px;height:82px;background:linear-gradient(180deg,#1a1a1a 0%,#0a0a0a 100%);border:1px solid #2a0000;border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 28px;box-shadow:0 0 0 1px #ff0022 inset,0 10px 40px rgba(255,0,34,0.35),0 0 80px rgba(255,0,34,0.15);position:relative}
.logo::after{content:'';position:absolute;width:100%;height:100%;border-radius:20px;background:radial-gradient(circle at 50% 0%, rgba(255,0,34,0.3), transparent 60%);pointer-events:none}
.logo svg{filter:drop-shadow(0 0 12px rgba(255,0,34,0.8))}
h1{font-size:26px;font-weight:800;margin:0 0 6px;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(180deg,#fff 0%,#aaa 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{color:#666;font-size:13px;margin:0 0 36px;letter-spacing:1px;text-transform:uppercase}
input{width:100%;padding:17px 18px;border-radius:14px;border:1px solid #1a1a1a;background:#0e0e0e;color:#fff;font-size:15px;transition:all 0.2s;text-align:center;letter-spacing:1px}
input::placeholder{color:#333}
input:focus{outline:none;border-color:#ff0022;background:#121212;box-shadow:0 0 0 4px rgba(255,0,34,0.15),0 0 20px rgba(255,0,34,0.2)}
.btn-primary{width:100%;padding:17px;border-radius:14px;border:none;background:linear-gradient(180deg,#ff0033 0%,#cc0011 100%);color:#fff;font-weight:800;font-size:16px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:all 0.15s;box-shadow:0 4px 0 #880000,0 10px 30px rgba(255,0,34,0.5)}
.btn-primary:hover{background:linear-gradient(180deg,#ff1144 0%,#e00011 100%);transform:translateY(-1px);box-shadow:0 5px 0 #880000,0 14px 40px rgba(255,0,34,0.65)}
.btn-primary:active{transform:translateY(3px);box-shadow:0 1px 0 #880000,0 4px 15px rgba(255,0,34,0.5)}
#msg{color:#ff3355;font-size:13px;margin-top:14px;min-height:20px;font-weight:600}
#misKeys{margin-top:28px;text-align:left}
.key-saved{background:#0e0e0e;border:1px solid #1a1a1a;padding:12px 14px;border-radius:10px;margin:8px 0;cursor:pointer;color:#555;font-size:12px;font-family:monospace;display:flex;justify-content:space-between;align-items:center;transition:0.2s}
.key-saved:hover{border-color:#ff0022;color:#fff;background:#151010}
.key-saved span.dot{width:7px;height:7px;background:#ff0022;border-radius:50%;display:inline-block;margin-right:8px;box-shadow:0 0 8px #ff0022}
.footer-note{color:#2a2a2a;font-size:11px;margin-top:40px;letter-spacing:0.5px}
#contenido{width:100%;max-width:900px;display:none;text-align:left}
.sala{background:#0e0e0e;border:1px solid #1a1a1a;padding:16px;border-radius:12px;margin:12px 0}
</style>
</head>
<body>
<div class="login-wrapper" id="login">
<div class="logo"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ff0022" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path><circle cx="12" cy="16" r="1" fill="#ff0022" stroke="none"></circle></svg></div>
<h1>Acceso</h1>
<p class="subtitle">Privado • Restringido • Seguro</p>
<input id="keyInput" type="password" placeholder="Pon tu key">
<button class="btn-primary" onclick="entrar()">Entrar</button>
<p id="msg"></p>
<div id="misKeys"></div>
<p class="footer-note">Acceso restringido. Key inválida será rechazada.</p>
</div>
<div id="contenido"><h2>🎬 Salas</h2><div id="lista"></div><button class="btn-primary" onclick="salir()" style="margin-top:20px;max-width:200px">Salir</button></div>
<script>
const API_URL = "";
function hashKey(k){ return CryptoJS.SHA256(k).toString(); }

async function entrar(){
  const k = document.getElementById('keyInput').value.trim();
  if(!k) return;
  document.getElementById('msg').innerText='Verificando...';
  try{
    const res = await fetch(API_URL + "/api/keys.json");
    if(!res.ok) throw new Error('No se pudo conectar a API');
    const keys = await res.json();
    
    const h = hashKey(k);
    // Buscar por hash, no por texto plano - SEGURO
    const found = keys.find(x=>x.key_hash===h);
    if(!found){ document.getElementById('msg').innerText='Key no existe'; return; }
    if(!found.activo){ document.getElementById('msg').innerText='Key revocada. Pide una nueva.'; return; }
    if(found.expira && new Date() > new Date(found.expira)){ document.getElementById('msg').innerText='Key expirada.'; return; }

    localStorage.setItem('vault_session_key', k);
    let mis = JSON.parse(localStorage.getItem('my_saved_keys')||'[]');
    if(!mis.includes(k)){ mis.push(k); localStorage.setItem('my_saved_keys', JSON.stringify(mis)); }
    mostrarContenido();
  }catch(e){
    document.getElementById('msg').innerText='Error API: '+e.message;
  }
}

async function mostrarContenido(){
  document.getElementById('login').style.display='none';
  document.getElementById('contenido').style.display='block';
  const listaDiv = document.getElementById('lista');
  try{
    const res = await fetch(API_URL + "/api/videos_enc.json");
    if(!res.ok) throw new Error('No hay videos aún');
    const enc = await res.text();
    let master = localStorage.getItem('vault_master_session');
    if(!master){ master = prompt('Pon clave maestra admin para ver videos:'); if(!master) return; }
    const bytes = CryptoJS.AES.decrypt(enc, master);
    const txt = bytes.toString(CryptoJS.enc.Utf8);
    if(!txt) throw new Error('Clave maestra incorrecta');
    const data = JSON.parse(txt);
    listaDiv.innerHTML = Object.keys(data).map(sala=>{
      return `<div class="sala"><b>${sala}</b><br><small>${data[sala].length} videos</small><br>${data[sala].slice(0,3).map(l=>`<a href="${l}" target="_blank" style="color:#ff0022">Ver</a>`).join(' | ')}</div>`;
    }).join('');
  }catch(e){ listaDiv.innerHTML='Error: '+e.message; }
}

function salir(){ localStorage.removeItem('vault_session_key'); location.reload(); }
function renderMisKeys(){
  const div = document.getElementById('misKeys');
  const mis = JSON.parse(localStorage.getItem('my_saved_keys')||'[]');
  if(mis.length===0){ div.innerHTML=''; return; }
  div.innerHTML = '<p style="color:#333;font-size:11px;margin-bottom:8px;letter-spacing:1px;text-transform:uppercase">Tus keys</p>' + mis.map(k=>`<div class="key-saved" onclick="usarKey('${k}')"><span><span class="dot"></span>${k.substring(0,4)}••••${k.slice(-4)}</span><span style="color:#222">→</span></div>`).join('');
}
function usarKey(k){ document.getElementById('keyInput').value = k; entrar(); }
renderMisKeys();
</script>
</body>
</html>
