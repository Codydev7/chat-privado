<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FΛITHFUL FØREVER</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    overflow: hidden;
}

button,
input,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

/* =========================
   ONBOARDING
========================= */

#onboarding {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

.onboarding-box {
    width: min(90%, 420px);
    text-align: center;
}

.logo {
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 3px;
    margin-bottom: 12px;
}

.subtitle {
    color: #888;
    font-size: 14px;
    margin-bottom: 35px;
}

.name-input {
    width: 100%;
    padding: 15px;
    background: #111;
    color: #fff;
    border: 1px solid #333;
    border-radius: 10px;
    outline: none;
    margin-bottom: 12px;
}

.name-input:focus {
    border-color: #777;
}

.start-button {
    width: 100%;
    padding: 15px;
    background: #fff;
    color: #000;
    border: none;
    border-radius: 10px;
    font-weight: bold;
}

.start-button:active {
    transform: scale(.98);
}

/* =========================
   CHAT
========================= */

#chatApp {
    width: 100%;
    height: 100%;
    display: none;
    flex-direction: column;
    background: #000;
}

/* =========================
   HEADER
========================= */

.header {
    height: 60px;
    flex-shrink: 0;
    border-bottom: 1px solid #222;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    background: #050505;
}

.header-title {
    font-size: 17px;
    font-weight: bold;
    letter-spacing: 1.5px;
}

.connection-status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: #777;
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #555;
}

.status-dot.online {
    background: #00ff66;
}

.status-dot.offline {
    background: #ff3333;
}

/* =========================
   MESSAGES
========================= */

#messages {
    flex: 1;
    overflow-y: auto;
    padding: 15px 12px 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    scroll-behavior: smooth;
}

.empty-chat {
    margin: auto;
    color: #555;
    text-align: center;
    font-size: 13px;
}

.message-row {
    display: flex;
    width: 100%;
}

.message-row.mine {
    justify-content: flex-end;
}

.message-row.theirs {
    justify-content: flex-start;
}

.message {
    max-width: min(80%, 430px);
    padding: 9px 11px 7px;
    border-radius: 13px;
    background: #171717;
    border: 1px solid #222;
    position: relative;
}

.message.mine {
    background: #202020;
}

.sender {
    color: #aaa;
    font-size: 11px;
    margin-bottom: 4px;
}

.message-text {
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 15px;
    line-height: 1.35;
}

.message-footer {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 5px;
    margin-top: 4px;
}

.message-time {
    color: #666;
    font-size: 10px;
}

.message-status {
    color: #777;
    font-size: 12px;
    letter-spacing: -3px;
}

.message-status.read {
    color: #ff3030;
}

/* =========================
   MEDIA
========================= */

.message-image {
    display: block;
    max-width: 100%;
    max-height: 350px;
    border-radius: 9px;
    object-fit: contain;
}

/* =========================
   MODERN AUDIO PLAYER
========================= */

.custom-audio-player {
    width: 270px;
    max-width: 100%;
    min-height: 58px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 10px;
    box-sizing: border-box;
    border-radius: 18px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.08);
}

.message.mine .custom-audio-player {
    background: rgba(255,255,255,0.12);
}

.audio-play-button,
.audio-speed-button,
.audio-download-button {
    flex: 0 0 auto;
    border: none;
    outline: none;
    cursor: pointer;
    color: #fff;
    background: rgba(255,255,255,0.10);
    transition:
        transform 0.15s ease,
        background 0.15s ease;
}

.audio-play-button:hover,
.audio-speed-button:hover,
.audio-download-button:hover {
    background: rgba(255,255,255,0.18);
}

.audio-play-button:active,
.audio-speed-button:active,
.audio-download-button:active {
    transform: scale(0.92);
}

.audio-play-button {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    padding: 0;
}

.audio-progress {
    flex: 1;
    min-width: 55px;
    height: 4px;
    margin: 0;
    padding: 0;
    accent-color: currentColor;
    cursor: pointer;
}

.audio-time {
    min-width: 34px;
    color: rgba(255,255,255,0.75);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    text-align: center;
}

.audio-speed-button {
    min-width: 39px;
    height: 30px;
    padding: 0 7px;
    border-radius: 9px;
    font-size: 11px;
    font-weight: 600;
}

.audio-download-button {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    padding: 0;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.custom-audio-player audio {
    display: none;
}

@media (max-width: 420px) {
    .custom-audio-player {
        width: 250px;
        gap: 6px;
        padding: 8px;
    }

    .audio-play-button {
        width: 36px;
        height: 36px;
    }

    .audio-time {
        min-width: 31px;
        font-size: 10px;
    }

    .audio-speed-button {
        min-width: 36px;
        padding: 0 5px;
    }

    .audio-download-button {
        width: 30px;
        height: 30px;
    }
}

/* =========================
   CONTEXT MENU
========================= */

#contextMenu {
    position: fixed;
    display: none;
    z-index: 2000;
    background: #181818;
    border: 1px solid #333;
    border-radius: 9px;
    min-width: 150px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,.6);
}

.context-item {
    padding: 12px 15px;
    color: #fff;
    font-size: 13px;
}

.context-item:hover {
    background: #292929;
}

.context-delete {
    color: #ff4444;
}

/* =========================
   RECORDING
========================= */

#recordingBar {
    display: none;
    height: 38px;
    flex-shrink: 0;
    background: #111;
    border-top: 1px solid #222;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: #ff4444;
    font-size: 13px;
}

.recording-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ff3333;
}

/* =========================
   INPUT
========================= */

.input-area {
    min-height: 62px;
    flex-shrink: 0;
    border-top: 1px solid #222;
    padding: 8px;
    background: #050505;
    display: flex;
    align-items: flex-end;
    gap: 7px;
}

.input-button {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border: 1px solid #333;
    background: #111;
    color: #fff;
    border-radius: 50%;
    font-size: 18px;
}

.input-button:active {
    background: #222;
}

.input-button.recording {
    background: #441111;
    border-color: #ff3333;
    color: #ff3333;
}

#messageInput {
    flex: 1;
    min-width: 0;
    min-height: 42px;
    max-height: 130px;
    resize: none;
    background: #111;
    color: #fff;
    border: 1px solid #333;
    border-radius: 21px;
    padding: 11px 15px;
    outline: none;
    line-height: 20px;
}

#messageInput:focus {
    border-color: #555;
}

.send-button {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border: none;
    border-radius: 50%;
    background: #fff;
    color: #000;
    font-weight: bold;
}

.send-button:active {
    transform: scale(.95);
}

/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    .header {
        height: 56px;
    }

    .header-title {
        font-size: 15px;
    }

    .message {
        max-width: 85%;
    }

    .message-text {
        font-size: 14px;
    }

    .input-button,
    .send-button {
        width: 40px;
        height: 40px;
    }

    #messageInput {
        min-height: 40px;
    }
}
</style>
</head>

<body>

<!-- =========================
     ONBOARDING
========================= -->

<div id="onboarding">

    <div class="onboarding-box">

        <div class="logo">
            FΛITHFUL FØREVER
        </div>

        <div class="subtitle">
            Enter your name to start chatting
        </div>

        <input
            id="nameInput"
            class="name-input"
            type="text"
            maxlength="30"
            autocomplete="off"
            placeholder="Your name"
        >

        <button
            id="startButton"
            class="start-button"
            type="button"
        >
            Start Chat
        </button>

    </div>

</div>


<!-- =========================
     CHAT APP
========================= -->

<div id="chatApp">

    <header class="header">

        <div class="header-title">
            FΛITHFUL FØREVER
        </div>

        <div class="connection-status">

            <span
                id="statusDot"
                class="status-dot offline"
            ></span>

            <span id="connectionText">
                OFFLINE
            </span>

        </div>

    </header>


    <main id="messages">

        <div
            id="emptyChat"
            class="empty-chat"
        >
            No messages yet
        </div>

    </main>


    <div id="recordingBar">

        <span class="recording-dot"></span>

        <span>
            Recording
        </span>

        <span id="recordingCounter">
            0:00
        </span>

    </div>


    <div class="input-area">

        <button
            id="photoButton"
            class="input-button"
            type="button"
            title="Photo"
        >
            +
        </button>

        <input
            id="photoInput"
            type="file"
            accept="image/*"
            style="display:none"
        >

        <textarea
            id="messageInput"
            rows="1"
            placeholder="Message..."
        ></textarea>

        <button
            id="recordButton"
            class="input-button"
            type="button"
            title="Record audio"
        >
            🎙
        </button>

        <button
            id="sendButton"
            class="send-button"
            type="button"
        >
            ➤
        </button>

    </div>

</div>


<!-- =========================
     CONTEXT MENU
========================= -->

<div id="contextMenu">

    <div
        id="downloadPhotoMenuItem"
        class="context-item"
        style="display: none;"
    >
        Download photo
    </div>

    <div
        id="deleteMenuItem"
        class="context-item context-delete"
    >
        Delete for everyone
    </div>

</div>


<script>

/* =========================
   VARIABLES
========================= */

let username =
    localStorage.getItem(
        'chat_username'
    ) || '';

let ws = null;

let reconnectTimer = null;

let selectedMessageId = null;
let selectedMessage = null;


function saveLocalMessages(messages) {
    try {
        localStorage.setItem(
            'chat_messages',
            JSON.stringify(messages || [])
        );
    } catch (error) {
        console.error('Local message save error:', error);
    }
}

function loadLocalMessages() {
    try {
        const saved = localStorage.getItem('chat_messages');
        if (saved === null) return [];
        const messages = JSON.parse(saved);
        return Array.isArray(messages) ? messages : [];
    } catch (error) {
        console.error('Local message load error:', error);
        return [];
    }
}

let mediaRecorder = null;

let audioChunks = [];

let recordingSeconds = 0;

let recordingInterval = null;


/* =========================
   ELEMENTS
========================= */

const onboarding =
    document.getElementById(
        'onboarding'
    );

const chatApp =
    document.getElementById(
        'chatApp'
    );

const nameInput =
    document.getElementById(
        'nameInput'
    );

const startButton =
    document.getElementById(
        'startButton'
    );

const messagesContainer =
    document.getElementById(
        'messages'
    );

const messageInput =
    document.getElementById(
        'messageInput'
    );

const sendButton =
    document.getElementById(
        'sendButton'
    );

const photoButton =
    document.getElementById(
        'photoButton'
    );

const photoInput =
    document.getElementById(
        'photoInput'
    );

const recordButton =
    document.getElementById(
        'recordButton'
    );

const statusDot =
    document.getElementById(
        'statusDot'
    );

const connectionText =
    document.getElementById(
        'connectionText'
    );

const emptyChat =
    document.getElementById(
        'emptyChat'
    );


/* =========================
   CONNECTION
========================= */

function connected() {

    return (
        ws &&
        ws.readyState ===
        WebSocket.OPEN
    );

}


function setConnectionStatus(
    online
) {

    if (online) {

        statusDot.classList.add(
            'online'
        );

        statusDot.classList.remove(
            'offline'
        );

        connectionText.textContent =
            'ONLINE';

    } else {

        statusDot.classList.add(
            'offline'
        );

        statusDot.classList.remove(
            'online'
        );

        connectionText.textContent =
            'OFFLINE';

    }

}


function connect() {

    if (!username) {
        return;
    }

    if (
        ws &&
        (
            ws.readyState ===
            WebSocket.OPEN ||
            ws.readyState ===
            WebSocket.CONNECTING
        )
    ) {
        return;
    }

    const protocol =
        location.protocol === 'https:'
            ? 'wss://'
            : 'ws://';

    ws =
        new WebSocket(
            protocol +
            location.host
        );

    ws.onopen = () => {

        console.log(
            'WebSocket connected'
        );

        setConnectionStatus(
            true
        );

        ws.send(
            JSON.stringify({
                type: 'presence',
                sender: username
            })
        );

    };


    ws.onmessage = event => {

        try {

            const data =
                JSON.parse(
                    event.data
                );

            handleServerMessage(
                data
            );

        } catch (error) {

            console.error(
                'Message error:',
                error
            );

        }

    };


    ws.onclose = () => {

        console.log(
            'WebSocket disconnected'
        );

        setConnectionStatus(
            false
        );

        clearTimeout(
            reconnectTimer
        );

        reconnectTimer =
            setTimeout(
                connect,
                500
            );

    };


    ws.onerror = error => {

        console.error(
            'WebSocket error:',
            error
        );

    };

}


/* =========================
   SERVER MESSAGES
========================= */

function handleServerMessage(
    data
) {

    if (
        data.type ===
        'history'
    ) {

        renderHistory(
            data.messages || []
        );

        return;
    }


    if (
        data.type ===
        'message'
    ) {

        const localMessages = loadLocalMessages();
        if (localMessages.findIndex(message => message.id === data.message.id) === -1) {
            localMessages.push(data.message);
            saveLocalMessages(localMessages);
        }
        renderMessage(
            data.message
        );

        if (
            data.message.sender !==
            username
        ) {
            sendMessageStatus(
                data.message.id,
                'delivered'
            );

            observeMessageAsRead(
                data.message.id
            );
        }

        scrollToBottom();

        return;
    }


    if (
        data.type ===
        'status'
    ) {

        updateMessageStatus(
            data.id,
            data.status,
            data.readTime
        );

        return;
    }


    if (
        data.type ===
        'delete'
    ) {

        removeMessage(
            data.id
        );

        return;
    }


    if (
        data.type ===
        'presence'
    ) {

        updatePresence(
            data.users || []
        );

    }

}


function sendMessageStatus(
    id,
    status
) {

    if (!connected()) {
        return;
    }

    ws.send(
        JSON.stringify({
            type: 'status',
            id: id,
            status: status
        })
    );

}


function observeMessageAsRead(
    id
) {

    const element =
        document.querySelector(
            `[data-message-id="${id}"]`
        );

    if (!element) {
        return;
    }

    if (
        element.dataset.readObserved ===
        'true'
    ) {
        return;
    }

    element.dataset.readObserved =
        'true';

    const observer =
        new IntersectionObserver(
            entries => {

                entries.forEach(
                    entry => {

                        if (
                            entry.isIntersecting
                        ) {

                            sendMessageStatus(
                                id,
                                'read'
                            );

                            observer.disconnect();

                        }

                    }
                );

            },
            {
                root:
                    messagesContainer,
                threshold:
                    0.5
            }
        );

    observer.observe(
        element
    );

}


/* =========================
   HISTORY
========================= */

function renderHistory(
    history
) {

    messagesContainer.innerHTML = '';
    if (history && history.length > 0) {
        saveLocalMessages(history);
    }

    if (
        !history ||
        history.length === 0
    ) {

        messagesContainer.appendChild(
            emptyChat
        );

        return;
    }

    history.forEach(
        message => {

            renderMessage(
                message
            );

        }
    );

    scrollToBottom();

}


/* =========================
   RENDER MESSAGE
========================= */

function renderMessage(
    message
) {

    if (!message) {
        return;
    }

    const old =
        document.querySelector(
            `[data-message-id="${message.id}"]`
        );

    if (old) {
        return;
    }

    if (emptyChat.parentNode) {
        emptyChat.remove();
    }


    const row =
        document.createElement(
            'div'
        );

    row.className =
        'message-row ' +
        (
            message.sender ===
            username
                ? 'mine'
                : 'theirs'
        );


    const bubble =
        document.createElement(
            'div'
        );

    bubble.className =
        'message ' +
        (
            message.sender ===
            username
                ? 'mine'
                : ''
        );

    bubble.dataset.messageId =
        message.id;


    const sender =
        document.createElement(
            'div'
        );

    sender.className =
        'sender';

    sender.textContent =
        message.sender ||
        'Unknown';


    bubble.appendChild(
        sender
    );


    if (
        message.type ===
        'photo'
    ) {

        const image =
            document.createElement(
                'img'
            );

        image.className =
            'message-image';

        image.src =
            message.file;

        image.loading =
            'lazy';

        image.addEventListener(
            'click',
            event => {
                event.stopPropagation();
                openPhotoViewer(
                    message.file
                );
            }
        );

        bubble.appendChild(
            image
        );

    } else if (
        message.type ===
        'audio'
    ) {

        const audioBox =
            document.createElement(
                'div'
            );

        audioBox.className =
            'custom-audio-player';

        const playButton =
            document.createElement(
                'button'
            );

        playButton.className =
            'audio-play-button';

        playButton.textContent =
            '▶';

        const progress =
            document.createElement(
                'input'
            );

        progress.type =
            'range';

        progress.className =
            'audio-progress';

        progress.min =
            '0';

        progress.max =
            '100';

        progress.value =
            '0';

        const timeLabel =
            document.createElement(
                'span'
            );

        timeLabel.className =
            'audio-time';

        timeLabel.textContent =
            '0:00';

        const speedButton =
            document.createElement(
                'button'
            );

        speedButton.className =
            'audio-speed-button';

        speedButton.textContent =
            '1×';

        speedButton.title =
            'Playback speed';

        const downloadButton =
            document.createElement(
                'button'
            );

        downloadButton.className =
            'audio-download-button';

        downloadButton.textContent =
            '↓';

        downloadButton.title =
            'Download audio';

        const audio =
            document.createElement(
                'audio'
            );

        audio.preload =
            'metadata';

        audio.src =
            message.file;

        const speeds = [
            1,
            1.5,
            2,
            0.5
        ];

        let speedIndex = 0;

        playButton.addEventListener(
            'click',
            event => {
                event.stopPropagation();

                if (audio.paused) {
                    audio.play();
                } else {
                    audio.pause();
                }
            }
        );

        speedButton.addEventListener(
            'click',
            event => {
                event.stopPropagation();

                speedIndex =
                    (speedIndex + 1) %
                    speeds.length;

                const speed =
                    speeds[speedIndex];

                audio.playbackRate =
                    speed;

                speedButton.textContent =
                    speed + '×';
            }
        );

        audio.addEventListener(
            'play',
            () => {
                playButton.textContent =
                    '❚❚';
            }
        );

        audio.addEventListener(
            'pause',
            () => {
                playButton.textContent =
                    '▶';
            }
        );

        audio.addEventListener(
            'loadedmetadata',
            () => {
                if (
                    Number.isFinite(
                        audio.duration
                    )
                ) {
                    progress.max =
                        audio.duration;

                    timeLabel.textContent =
                        formatAudioTime(
                            audio.duration
                        );
                }
            }
        );

        audio.addEventListener(
            'timeupdate',
            () => {
                progress.value =
                    audio.currentTime;

                timeLabel.textContent =
                    formatAudioTime(
                        audio.currentTime
                    );
            }
        );

        audio.addEventListener(
            'ended',
            () => {
                progress.value =
                    '0';

                timeLabel.textContent =
                    formatAudioTime(
                        audio.duration || 0
                    );

                playButton.textContent =
                    '▶';
            }
        );

        progress.addEventListener(
            'input',
            event => {
                event.stopPropagation();

                audio.currentTime =
                    Number(
                        progress.value
                    );
            }
        );

        downloadButton.addEventListener(
            'click',
            event => {
                event.stopPropagation();

                downloadAudio(
                    message.file
                );
            }
        );

        audioBox.appendChild(
            playButton
        );

        audioBox.appendChild(
            progress
        );

        audioBox.appendChild(
            timeLabel
        );

        audioBox.appendChild(
            speedButton
        );

        audioBox.appendChild(
            downloadButton
        );

        audioBox.appendChild(
            audio
        );

        bubble.appendChild(
            audioBox
        );

    } else {

        const text =
            document.createElement(
                'div'
            );

        text.className =
            'message-text';

        text.textContent =
            message.text || '';

        bubble.appendChild(
            text
        );

    }


    const footer =
        document.createElement(
            'div'
        );

    footer.className =
        'message-footer';


    const time =
        document.createElement(
            'span'
        );

    time.className =
        'message-time';

    time.textContent =
        message.time || '';

    footer.appendChild(
        time
    );


    if (
        message.sender ===
        username
    ) {

        const status =
            document.createElement(
                'span'
            );

        status.className =
            'message-status';

        status.dataset.statusId =
            message.id;

        setStatusDisplay(
            status,
            message.status
        );

        footer.appendChild(
            status
        );

    }


    bubble.appendChild(
        footer
    );


    bubble.addEventListener(
        'contextmenu',
        event => {

            event.preventDefault();

            selectedMessage = message;

            selectedMessageId =
                message.id;

            showContextMenu(
                event.clientX,
                event.clientY
            );

        }
    );


    row.appendChild(
        bubble
    );

    messagesContainer.appendChild(
        row
    );

}


/* =========================
   STATUS
========================= */

function setStatusDisplay(
    element,
    status
) {

    element.classList.remove(
        'read'
    );

    if (
        status ===
        'read'
    ) {

        element.textContent =
            '✓✓';

        element.classList.add(
            'read'
        );

    } else if (
        status ===
        'delivered'
    ) {

        element.textContent =
            '✓✓';

    } else {

        element.textContent =
            '✓';

    }

}


function updateMessageStatus(
    id,
    status,
    readTime
) {

    const element =
        document.querySelector(
            `[data-status-id="${id}"]`
        );

    if (!element) {
        return;
    }

    setStatusDisplay(
        element,
        status
    );

}


/* =========================
   PRESENCE
========================= */

function updatePresence(
    users
) {

    const otherUsers =
        users.filter(
            user =>
                user !== username
        );

    if (
        otherUsers.length > 0
    ) {

        connectionText.textContent =
            'ONLINE';

    } else {

        connectionText.textContent =
            connected()
                ? 'CONNECTED'
                : 'OFFLINE';

    }

}


/* =========================
   SEND TEXT
========================= */

function sendMessage() {

    const text =
        messageInput.value.trim();

    if (!text) {
        return;
    }

    if (!connected()) {

        alert(
            'Not connected. Please wait...'
        );

        return;
    }


    ws.send(
        JSON.stringify({
            type: 'message',
            text: text,
            sender: username
        })
    );


    messageInput.value = '';

    autoResize();

    setTimeout(() => {
        messageInput.focus();
    }, 0);

}


sendButton.addEventListener(
    'click',
    sendMessage
);


messageInput.addEventListener(
    'keydown',
    event => {

        if (
            event.key === 'Enter' &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================
   TEXTAREA SIZE
========================= */

function autoResize() {

    messageInput.style.height =
        'auto';

    messageInput.style.height =
        Math.min(
            messageInput.scrollHeight,
            130
        ) + 'px';

}


messageInput.addEventListener(
    'input',
    autoResize
);


/* =========================
   SCROLL
========================= */

function scrollToBottom() {

    requestAnimationFrame(
        () => {

                 messagesContainer.scrollTop =
                messagesContainer.scrollHeight;

        }
    );

}


/* =========================
   CONTEXT MENU
========================= */

function showContextMenu(
    x,
    y
) {

    const menu =
        document.getElementById(
            'contextMenu'
        );

    const downloadPhotoMenuItem =
        document.getElementById(
            'downloadPhotoMenuItem'
        );

    const deleteMenuItem =
        document.getElementById(
            'deleteMenuItem'
        );

    const isMine =
        selectedMessage &&
        selectedMessage.sender ===
        username;

    const isPhoto =
        selectedMessage &&
        selectedMessage.type ===
        'photo';

    downloadPhotoMenuItem.style.display =
        isPhoto
            ? 'block'
            : 'none';

    deleteMenuItem.style.display =
        isMine
            ? 'block'
            : 'none';

    menu.style.left =
        x + 'px';

    menu.style.top =
        y + 'px';

    menu.style.display =
        'block';
}

function hideContextMenu() {

    document.getElementById(
        'contextMenu'
    ).style.display =
        'none';

}


document.addEventListener(
    'click',
    hideContextMenu
);


function formatAudioTime(seconds) {
    if (!Number.isFinite(seconds) || seconds < 0) {
        return '0:00';
    }

    const minutes =
        Math.floor(seconds / 60);

    const remainingSeconds =
        Math.floor(seconds % 60);

    return (
        minutes +
        ':' +
        String(
            remainingSeconds
        ).padStart(2, '0')
    );
}

function downloadAudio(src) {
    if (!src) {
        return;
    }

    const link =
        document.createElement(
            'a'
        );

    link.href =
        src;

    link.download =
        'audio';

    document.body.appendChild(
        link
    );

    link.click();

    link.remove();
}

/* =========================
   PHOTO ACTIONS
========================= */

function downloadPhoto(src) {

    if (!src) {
        return;
    }

    const link =
        document.createElement('a');

    link.href = src;
    link.download = 'photo';

    document.body.appendChild(link);
    link.click();
    link.remove();
}


function openPhotoViewer(src) {

    if (!src) {
        return;
    }

    const viewer =
        document.createElement('div');

    viewer.style.position = 'fixed';
    viewer.style.inset = '0';
    viewer.style.background = 'rgba(0,0,0,0.95)';
    viewer.style.display = 'flex';
    viewer.style.alignItems = 'center';
    viewer.style.justifyContent = 'center';
    viewer.style.zIndex = '3000';
    viewer.style.padding = '20px';
    viewer.style.boxSizing = 'border-box';

    const image =
        document.createElement('img');

    image.src = src;
    image.style.maxWidth = '100%';
    image.style.maxHeight = '100%';
    image.style.objectFit = 'contain';

    const downloadButton =
        document.createElement('button');

    downloadButton.textContent =
        'Download photo';

    downloadButton.style.position = 'absolute';
    downloadButton.style.bottom = '25px';
    downloadButton.style.left = '50%';
    downloadButton.style.transform = 'translateX(-50%)';
    downloadButton.style.padding = '12px 20px';
    downloadButton.style.border = 'none';
    downloadButton.style.borderRadius = '10px';
    downloadButton.style.fontSize = '16px';

    downloadButton.addEventListener(
        'click',
        event => {
            event.stopPropagation();
            downloadPhoto(src);
        }
    );

    viewer.appendChild(image);
    viewer.appendChild(downloadButton);

    viewer.addEventListener(
        'click',
        () => {
            viewer.remove();
        }
    );

    document.body.appendChild(viewer);
}


/* =========================
   DELETE
========================= */

function deleteSelectedMessage() {

    hideContextMenu();

    if (!selectedMessageId) {
        return;
    }

    if (!connected()) {
        return;
    }

    ws.send(
        JSON.stringify({
            type: 'delete',
            id: selectedMessageId,
            sender: username
        })
    );

    selectedMessageId = null;

}


document
    .getElementById(
        'deleteMenuItem'
    )
    .addEventListener(
        'click',
        deleteSelectedMessage
    );


function removeMessage(
    id
) {

    const message =
        document.querySelector(
            `[data-message-id="${id}"]`
        );

    if (!message) {
        return;
    }

    const row =
        message.closest(

        );

    }

    if (
        messagesContainer
            .querySelectorAll(
                '.message-row'
            )
            .length === 0
    ) {

        messagesContainer.appendChild(
            emptyChat
        );

    }

}


/* =========================
   PHOTO
========================= */

photoButton.addEventListener(
    'click',
    () => {

        photoInput.click();

    }
);


photoInput.addEventListener(
    'change',
    async event => {

        const file =
            event.target.files[0];

        if (!file) {
            return;
        }

        await uploadFile(
            file,
            'photo'
        );

        event.target.value = '';

    }
);


/* =========================
   UPLOAD
========================= */

async function uploadFile(
    file,
    mediaType
) {

    try {

        if (!connected()) {

            alert(
                'Not connected. Please wait...'
            );

            return;
        }

        const formData =
            new FormData();

        formData.append(
            'file',
            file
        );

        const response =
            await fetch(
                '/upload',
                {
                    method: 'POST',
                    body: formData
                }
            );

        const result =
            await response.json();

        if (
            !result.success ||
            !result.file
        ) {

            alert(
                'Upload failed'
            );

            return;
        }

        ws.send(
            JSON.stringify({
                type: 'media',
                mediaType:
                    mediaType,
                file:
                    result.file,
                sender:
                    username
            })
        );

    } catch (error) {

        console.error(
            'Upload error:',
            error
        );

        alert(
            'Upload failed'
        );

    }

}


/* =========================
   RECORDING
========================= */

recordButton.addEventListener(
    'click',
    toggleRecording
);


async function toggleRecording() {

    if (
        mediaRecorder &&
        mediaRecorder.state ===
            'recording'
    ) {

        stopRecording();

        return;
    }

    try {

        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    audio: true
                });

        audioChunks = [];

        mediaRecorder =
            new MediaRecorder(
                stream
            );

        mediaRecorder.ondataavailable =
            event => {

                if (
                    event.data.size > 0
                ) {

                    audioChunks.push(
                        event.data
                    );

                }

            };

        mediaRecorder.onstop =
            async () => {

                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );

                const blob =
                    new Blob(
                        audioChunks,
                        {
                            type:
                                mediaRecorder
                                    .mimeType ||
                                'audio/webm'
                        }
                    );

                const file =
                    new File(
                        [blob],
                        'audio.webm',
                        {
                            type:
                                blob.type
                        }
                    );

                await uploadFile(
                    file,
                    'audio'
                );

                resetRecordingUI();

            };

        mediaRecorder.start();

        recordingSeconds =
            0;

        recordButton.classList.add(
            'recording'
        );

        document
            .getElementById(
                'recordingBar'
            )
            .style.display =
            'flex';

        updateRecordingCounter();

        recordingInterval =
            setInterval(
                () => {

                    recordingSeconds++;

                    updateRecordingCounter();

                },
                1000
            );

    } catch (error) {

        console.error(
            'Microphone error:',
            error
        );

        alert(
            'Microphone permission is required.'
        );

    }

}


function stopRecording() {

    if (
        mediaRecorder &&
        mediaRecorder.state ===
            'recording'
    ) {

        mediaRecorder.stop();

    }

}


function updateRecordingCounter() {

    const minutes =
        Math.floor(
            recordingSeconds / 60
        );

    const seconds =
        recordingSeconds % 60;

    document
        .getElementById(
            'recordingCounter'
        )
        .textContent =
        minutes +
        ':' +
        String(
            seconds
        ).padStart(
            2,
            '0'
        );

}


function resetRecordingUI() {

    clearInterval(
        recordingInterval
    );

    recordingInterval =
        null;

    recordButton.classList.remove(
        'recording'
    );

    document
        .getElementById(
            'recordingBar'
        )
        .style.display =
        'none';

    recordingSeconds =
        0;

}

   ONBOARDING
========================= */

function startChat() {

    const name =
        nameInput.value.trim();

    if (!name) {

        nameInput.focus();

        return;
    }

    username =
        name;

    localStorage.setItem(
        'chat_username',
        username
    );

    onboarding.style.display =
        'none';

    chatApp.style.display =
        'flex';

    const localMessages = loadLocalMessages();
    if (localMessages.length > 0) {
        renderHistory(localMessages);
    }
    connect();

}


startButton.addEventListener(
    'click',
    startChat
);


nameInput.addEventListener(

    event => {

            startChat();

        }

    }
);

    const localMessages = loadLocalMessages();

            connect();
